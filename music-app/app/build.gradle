plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvmusic'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvmusic'
        // The TV runs Android 9 (API 28); 26 is the floor for the font resources and the focus API used here.
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            // R8 strips the unused AndroidX code; names stay readable in a sideloaded app.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with the debug key, like the launcher.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
